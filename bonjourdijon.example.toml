# BonjourDijon configuration
#
# Config search order:
#   1. --config <path>     (CLI flag)
#   2. ./bonjourdijon.toml (working directory)
#   3. ~/.config/bonjourdijon/config.toml  (recommended)
#
# Priority: CLI args > env vars > this file > defaults
#
# Relative paths (db, templates) are resolved against the directory
# containing this config file — so they work from any working directory.

# SQLite database path (default: ~/.config/bonjourdijon/bonjourdijon.db)
# db = "bonjourdijon.db"

# Web UI port
port = 3000

# Log level: trace, debug, info, warn, error, off
log_level = "info"

# Tera template glob (use absolute path if config lives outside the repo)
# templates = "templates/**/*.html"
# templates = "/home/you/bonjourdijon/templates/**/*.html"

[telegram]
# Telegram bot token (optional — omit to run web UI only)
# token = "123456:ABC-DEF..."
# allowed_users = ["your_telegram_user_id"]

[openrouter]
# API key for the /ai command (optional — uses OpenRouter.ai)
# Get a free key at https://openrouter.ai/keys
# api_key = "sk-or-v1-..."
# model = "google/gemini-2.0-flash-exp:free"  # default, free tier
# Other free options: "meta-llama/llama-4-scout", "deepseek/deepseek-chat-v3-0324:free"
