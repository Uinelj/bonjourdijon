[package]
name = "bonjourdijon"
version = "0.1.2"
edition = "2024"
description = "A Telegram bot and web dashboard for household chores, groceries, reminders, and calendar events."
license = "MIT"
repository = "https://gitdot.io/uj/bonjourdijon"

[dependencies]
tokio = { version = "1", features = ["full"] }
teloxide = { version = "0.17", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.13"
tera = "1"
log = "0.4"
env_logger = "0.11"
once_cell = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
