<!DOCTYPE html>
<html lang="en" data-theme="light" data-hour="{{ hour }}" data-load="{{ load_level }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}bonjourdijon{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    {% block head %}{% endblock %}
    <script>
    (function(){
        var s = localStorage.getItem('theme');
        var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = s || sys;
    })();
    </script>
</head>
<body>
    <div class="frame">
        <nav>
            <a href="/" class="logo"><span class="dot">●</span> bjd</a>
            <div class="nav-links">
                <a href="/">/home</a>
                <a href="/chores">/chores</a>
                <a href="/groceries">/groceries</a>
                <a href="/groceries/map">/map</a>
                <a href="/lists">/lists</a>
                <a href="/calendar">/cal</a>
                <a href="/settings">/cfg</a>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" title="toggle theme">◐</button>
        </nav>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    <script>
    function toggleTheme(){
        var h = document.documentElement;
        var n = h.dataset.theme === 'dark' ? 'light' : 'dark';
        h.dataset.theme = n;
        localStorage.setItem('theme', n);
    }
    </script>
</body>
</html>
